[project]
name = "speedtest"
version = "1.6.0"
description = "Асинхронный замер скорости интернета (параллельное скачивание)"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.11", "tenacity>=9.0"]

[project.scripts]
speedtest = "speedtest.cli:run"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "coverage",
    "pytest-cov",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "B",
    "I",
    "UP",
    "D",
    "SIM",
    "C4",
    "RUF",
    "PT",
    "S",
    "ANN",
    "RET",
    "PERF",
    "G",
    "N",
    "A",
    "PIE",
    "C90",
    "PLR0402",
]
ignore = ["D401", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "SLF001", "ARG", "ANN001", "ANN201", "ANN202", "ANN204"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["speedtest"]
branch = true
omit = ["speedtest/__main__.py"]

[tool.coverage.report]
show_missing = true
